</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e05243"/></marker></defs><rect x="0" y="0" width="2000" height="1200" rx="0" class="bg"/><text x="1000" y="53" class="title" text-anchor="middle">TPS54331DR · 12 V → 5 V / 3 A PCB 布局示意</text><text x="1000" y="87" class="subtitle" text-anchor="middle">顶层器件相对位置 · 参考 TI SLVS839H 图 8-16 · 非尺寸图，非已布线 PCB</text><rect x="55" y="130" width="1890" height="780" rx="20" class="board"/><text x="90" y="170" class="head">连续 GND 平面（顶层/内层或底层）</text><rect x="100" y="300" width="150" height="135" rx="10" class="connector"/><text x="175" y="348" class="head" text-anchor="middle">J1</text><text x="175" y="383" class="label" text-anchor="middle">12 V IN</text><text x="175" y="415" class="small" text-anchor="middle">GND</text><rect x="290" y="280" width="130" height="165" rx="10" class="passive"/><text x="355" y="327" class="head" text-anchor="middle">CIN1/2</text><text x="355" y="362" class="label" text-anchor="middle">2 × 10 µF</text><text x="355" y="399" class="small" text-anchor="middle">VIN / GND</text><rect x="505" y="270" width="260" height="250" rx="10" class="chip"/><text x="635" y="318" class="head" text-anchor="middle">U1</text><text x="635" y="350" class="label" text-anchor="middle">TPS54331DR</text><text x="635" y="386" class="small" text-anchor="middle">VIN  →  PH</text><text x="635" y="418" class="small" text-anchor="middle">GND / BOOT</text><text x="635" y="451" class="small" text-anchor="middle">SOIC-8 D</text><rect x="800" y="460" width="120" height="120" rx="10" class="diode"/><text x="860" y="507" class="head" text-anchor="middle">D1</text><text x="860" y="541" class="small" text-anchor="middle">40 V / 5 A</text><rect x="990" y="280" width="220" height="180" rx="10" class="inductor"/><text x="1100" y="338" class="head" text-anchor="middle">L1</text><text x="1100" y="378" class="label" text-anchor="middle">10 µH</text><text x="1100" y="417" class="small" text-anchor="middle">屏蔽型</text><rect x="1280" y="280" width="200" height="175" rx="10" class="passive"/><text x="1380" y="329" class="head" text-anchor="middle">COUT1/2</text><text x="1380" y="367" class="label" text-anchor="middle">2 × 47 µF</text><text x="1380" y="407" class="small" text-anchor="middle">VOUT / GND</text><rect x="1640" y="300" width="230" height="135" rx="10" class="connector"/><text x="1755" y="348" class="head" text-anchor="middle">J2</text><text x="1755" y="383" class="label" text-anchor="middle">5 V / 3 A</text><text x="1755" y="415" class="small" text-anchor="middle">GND</text><path d="M250 330H290 M420 330H505" class="vin"/><path d="M765 348H990" class="ph"/><path d="M860 460V348" class="ph"/><path d="M1210 348H1280 M1480 348H1640" class="vout"/><path d="M355 445V600H635V520 M635 600H860V580" class="gnd"/><circle cx="370" cy="600" r="9" class="via"/><circle cx="420" cy="600" r="9" class="via"/><circle cx="590" cy="600" r="9" class="via"/><circle cx="650" cy="600" r="9" class="via"/><circle cx="825" cy="600" r="9" class="via"/><circle cx="875" cy="600" r="9" class="via"/><circle cx="1330" cy="515" r="9" class="via"/><circle cx="1390" cy="515" r="9" class="via"/><circle cx="1450" cy="515" r="9" class="via"/><rect x="450" y="740" width="430" height="140" rx="10" class="legend"/><text x="665" y="772" class="head" text-anchor="middle">安静模拟区</text><rect x="505" y="800" width="100" height="50" rx="10" class="passive"/><text x="555" y="831" class="label" text-anchor="middle">RFB</text><rect x="640" y="800" width="100" height="50" rx="10" class="passive"/><text x="690" y="831" class="label" text-anchor="middle">COMP</text><rect x="775" y="800" width="70" height="50" rx="10" class="passive"/><text x="810" y="831" class="label" text-anchor="middle">SS</text><path d="M1380 455V705H555V800" class="fb"/><text x="967" y="686" class="blue" text-anchor="middle">FB Kelvin 取样：COUT 正端 → RFB → U1 VSENSE</text><path d="M355 255H850V625H355V255" class="zone"/><text x="615" y="238" class="warn" text-anchor="middle">① 输入脉冲回路：CIN–VIN–U1–D1–GND，面积尽量小</text><path d="M780 265H965V445H780V265" class="zone"/><text x="1140" y="645" class="warn" text-anchor="middle">② PH 铜箔最小化，禁布 FB/COMP/SS</text><rect x="1100" y="745" width="760" height="110" rx="10" class="tag"/><text x="1130" y="778" class="head">走线与阻抗判断</text><text x="1130" y="808" class="small">VIN / VOUT / GND：1 oz 外层铜先按 ≥ 1.5–2.0 mm 或铺铜估算</text><text x="1130" y="838" class="small">PH：短、小、远离模拟线；本芯片无 50 Ω 单端或差分阻抗要求</text><rect x="55" y="940" width="1890" height="210" rx="10" class="legend"/><text x="85" y="980" class="head">投板前的具体检查</text><text x="85" y="1017" class="small">P0  CIN 靠 VIN/GND；D1 紧靠 PH；PH 仅连 U1、D1、L1；GND 引脚就近接连续地平面。</text><text x="85" y="1051" class="small">P1  3 A 电源线按铜厚、温升、压降计算；换层并联过孔；U1 GND 附近放接地/散热过孔，实测 SOIC-8 温升。</text><text x="85" y="1085" class="small">P1  RFB/COMP/SS 远离 PH 与电感，FB 从 COUT 安静点取样；补偿回地不共用二极管脉冲回路。</text><text x="85" y="1119" class="small">P2  缺少实际叠层、铜厚、板厂工艺和 VIN_MAX；图中线宽只是首版起点，尚未通过 DRC、EMI、热及环路测试。</text></svg>